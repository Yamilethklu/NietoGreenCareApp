name: Build private iPhone installation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Expo token and app config
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Configure EXPO_TOKEN"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Configure EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] && [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure a public Supabase key"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - name: Build authorized owner iPhone (Ad Hoc)
        run: npx eas-cli build --platform ios --profile owner-private --non-interactive --wait
