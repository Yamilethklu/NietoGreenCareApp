name: EAS Update OTA iOS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'tsconfig.json'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS update channel, or comma separated channels"
        required: true
        default: "production,preview"
      runtime_versions:
        description: "Runtime versions to publish, comma separated"
        required: true
        default: "1.1.9"
      message:
        description: "Update message"
        required: true
        default: "iOS panel fix"

permissions:
  contents: read

concurrency:
  group: eas-update-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check required Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN in GitHub secrets or variables."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - name: Publish iOS EAS Updates for installed runtime
        shell: bash
        run: |
          CHANNELS="${{ github.event.inputs.channel }}"
          MESSAGE="${{ github.event.inputs.message }}"
          RUNTIME_VERSIONS="${{ github.event.inputs.runtime_versions }}"
          if [ -z "$CHANNELS" ]; then CHANNELS="production,preview"; fi
          if [ -z "$MESSAGE" ]; then MESSAGE="iOS panel fix"; fi
          if [ -z "$RUNTIME_VERSIONS" ]; then RUNTIME_VERSIONS="1.1.9"; fi

          ORIGINAL_APP_JSON="$(cat app.json)"
          IFS=',' read -ra CHANNEL_LIST <<< "$CHANNELS"
          IFS=',' read -ra RUNTIMES <<< "$RUNTIME_VERSIONS"
          for CHANNEL in "${CHANNEL_LIST[@]}"; do
            CHANNEL="$(echo "$CHANNEL" | xargs)"
            if [ -z "$CHANNEL" ]; then continue; fi
            for RUNTIME in "${RUNTIMES[@]}"; do
              RUNTIME="$(echo "$RUNTIME" | xargs)"
              if [ -z "$RUNTIME" ]; then continue; fi
              node -e "const fs=require('fs'); const app=JSON.parse(fs.readFileSync('app.json','utf8')); app.expo.runtimeVersion=process.argv[1]; fs.writeFileSync('app.json', JSON.stringify(app,null,2)+'\\n');" "$RUNTIME"
              echo "Publishing iOS OTA update to channel=$CHANNEL runtime=$RUNTIME"
              npx eas-cli update --channel "$CHANNEL" --platform ios --message "$MESSAGE (iOS channel $CHANNEL runtime $RUNTIME)" --non-interactive
            done
          done
          printf '%s' "$ORIGINAL_APP_JSON" > app.json
