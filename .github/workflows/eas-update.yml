name: EAS Update OTA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS update channel"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
          - development
      platform:
        description: "Platform to update"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios
      message:
        description: "Update message"
        required: true
        default: "Fix Google login role persistence"

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.event.inputs.channel }}-${{ github.event.inputs.platform }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN in GitHub secrets or variables."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - name: Publish EAS Update
        run: npx eas-cli update --channel "${{ github.event.inputs.channel }}" --platform "${{ github.event.inputs.platform }}" --message "${{ github.event.inputs.message }}" --non-interactive
