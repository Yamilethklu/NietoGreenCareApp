name: EAS Update OTA

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'tsconfig.json'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS update channel"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
          - development
      platform:
        description: "Platform to update"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios
      runtime_versions:
        description: "Runtime versions to publish, comma separated"
        required: true
        default: "1.1.9,1.1.4"
      message:
        description: "Update message"
        required: true
        default: "Fix Google login role persistence"

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN in GitHub secrets or variables."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - name: Publish EAS Updates for installed runtimes
        shell: bash
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          PLATFORM="${{ github.event.inputs.platform }}"
          MESSAGE="${{ github.event.inputs.message }}"
          RUNTIME_VERSIONS="${{ github.event.inputs.runtime_versions }}"
          if [ -z "$CHANNEL" ]; then CHANNEL="production"; fi
          if [ -z "$PLATFORM" ]; then PLATFORM="all"; fi
          if [ -z "$MESSAGE" ]; then MESSAGE="Fix Google login role persistence"; fi
          if [ -z "$RUNTIME_VERSIONS" ]; then RUNTIME_VERSIONS="1.1.9,1.1.4"; fi

          ORIGINAL_APP_JSON="$(cat app.json)"
          IFS=',' read -ra RUNTIMES <<< "$RUNTIME_VERSIONS"
          for RUNTIME in "${RUNTIMES[@]}"; do
            RUNTIME="$(echo "$RUNTIME" | xargs)"
            if [ -z "$RUNTIME" ]; then continue; fi
            node -e "const fs=require('fs'); const app=JSON.parse(fs.readFileSync('app.json','utf8')); app.expo.runtimeVersion=process.argv[1]; fs.writeFileSync('app.json', JSON.stringify(app,null,2)+'\\n');" "$RUNTIME"
            echo "Publishing OTA update to channel=$CHANNEL platform=$PLATFORM runtime=$RUNTIME"
            npx eas-cli update --channel "$CHANNEL" --platform "$PLATFORM" --message "$MESSAGE (runtime $RUNTIME)" --non-interactive
          done
          printf '%s' "$ORIGINAL_APP_JSON" > app.json
