name: Submit App Store build to Apple (Custom App)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: ID of a completed iOS production EAS build
        required: true
        type: string
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify parameters
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN"; exit 1; }
          test -n "$BUILD_ID" || { echo "::error::Provide EAS production build ID"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Submit existing production build for App Store Connect processing
        run: eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive --no-wait
