# DESHABILITADO: usar EAS manualmente (eas build, eas submit).
# Este workflow se disparaba automáticamente y consumía cuota.
name: Submit Nieto Green Care to TestFlight
on:
  # Deshabilitado automáticamente. Usar EAS manualmente.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe YES para confirmar ejecución manual'
        required: true
      build_id:
        description: EAS iPhone production build ID
        required: true
        default: 9ccc7dd0-9131-4fd7-a78e-4a144ce0556f
permissions:
  contents: read
jobs:
  submit:
    if: ${{ inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: ${{ inputs.build_id || '9ccc7dd0-9131-4fd7-a78e-4a144ce0556f' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Submit existing build without creating another build
        run: eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive --no-wait
