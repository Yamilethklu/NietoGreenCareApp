name: iPhone build (Apple credentials required)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-build.yml', 'app.json']
  workflow_dispatch:
    inputs:
      profile:
        description: production for TestFlight, preview for registered devices
        type: choice
        options: [production, preview]
        default: production
        required: true
      apple_ready:
        description: Signing credentials for the selected distribution are configured in EAS
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.apple_ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_PROFILE: ${{ inputs.profile || 'production' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required configuration
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo '::error::Missing EXPO_TOKEN or existing public Supabase configuration.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - name: Pass existing public app configuration to remote build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const profile = process.env.BUILD_PROFILE;
          if (!['production', 'preview'].includes(profile)) throw new Error('Invalid profile');
          config.build[profile].env = {
            ...config.build[profile].env,
            EXPO_PUBLIC_SUPABASE_URL: process.env.EXPO_PUBLIC_SUPABASE_URL,
            EXPO_PUBLIC_SUPABASE_ANON_KEY: process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY,
          };
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2));
          NODE
      - name: Request signed iPhone build
        run: |
          if [ "$BUILD_PROFILE" = "production" ]; then
            eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
          else
            eas build --platform ios --profile "$BUILD_PROFILE" --non-interactive --no-wait
          fi
