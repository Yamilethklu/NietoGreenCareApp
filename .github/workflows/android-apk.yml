name: Android APK

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe YES para confirmar la compilación de la APK actual'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing configuration without printing secrets
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || { [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; }; then
            echo '::error::Missing EXPO_TOKEN or existing public Supabase configuration.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/*.test.cjs
      - name: Pass existing public app configuration to remote build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          config.build.preview.env = {
            ...config.build.preview.env,
            EXPO_PUBLIC_SUPABASE_URL: process.env.EXPO_PUBLIC_SUPABASE_URL,
            EXPO_PUBLIC_SUPABASE_ANON_KEY: process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY || '',
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || '',
          };
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2));
          NODE
      - name: Build and wait for the current Android APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
      - name: Download APK from EAS
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-build.json', 'utf8');
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url || !/^https:\/\//.test(url)) {
            throw new Error('EAS terminó sin devolver una URL de APK válida.');
          }
          fs.writeFileSync('apk-url.txt', url);
          NODE
          curl --fail --location --retry 3 "$(cat apk-url.txt)" --output NietoGreenCareApp-1.1.10.apk
          test -s NietoGreenCareApp-1.1.10.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.10
          name: Nieto Green Care Android 1.1.10
          body: |
            APK Android generada desde la rama main del repositorio.
            Versión de la app: 1.1.10.
            La compilación solo se publica si EAS termina correctamente y el archivo APK se descarga.
          files: NietoGreenCareApp-1.1.10.apk
          make_latest: true
